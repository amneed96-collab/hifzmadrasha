<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A3D62">
<title>হিফয মাদরাসা ব্যবস্থাপনা</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="config.js"></script>
<style>
:root{--sea:#0A3D62;--sea2:#0F5A8F;--deep:#062A44;--aqua:#1FA3C4;--ink:#10212E;--mute:#56707F;--bg:#E9F1F7;--line:#CBDCE8;--field:#B3C7D6;--red:#B3392B;--ok:#1F7A5A;--tint:#EEF5FA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Noto Sans Bengali','Hind Siliguri','Kalpurush','Nirmala UI','Vrinda',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;background:var(--sea);color:#fff;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px}
.burger{width:42px;height:42px;border:0;background:transparent;border-radius:6px;display:grid;place-content:center;cursor:pointer}
.burger:hover{background:rgba(255,255,255,.14)}
.brand{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.brand img{height:34px;width:34px;border-radius:50%;background:#fff;object-fit:cover;vertical-align:middle;margin-right:8px}
#stat{font-size:12px;opacity:.8;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(6,42,68,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:86vw;background:#fff;z-index:50;transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;box-shadow:2px 0 14px rgba(0,0,0,.25)}
.drawer.open{transform:none}
.dh{background:var(--deep);color:#fff;padding:16px;font-weight:700}
.dh small{display:block;font-weight:400;opacity:.75}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;cursor:pointer;font-weight:600}
.mi:hover{background:var(--tint)}
.mi.act{border-left:4px solid var(--aqua);background:var(--tint);padding-left:12px}
.mi .ch{transition:transform .2s;color:var(--mute)}
.grp.open>.mi .ch{transform:rotate(90deg)}
.sub{display:none;background:#F5F9FC}
.grp.open>.sub{display:block}
.sub .mi{font-weight:400;padding-left:32px;border-bottom:1px solid #E1ECF3}
.sub .mi.act{padding-left:28px;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px;color:var(--deep)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.sec{font-weight:700;border-left:4px solid var(--aqua);padding-left:10px;margin:18px 0 10px;color:var(--deep)}
.sec:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;font-size:14px}
.fld>span,.sigbox>span{color:var(--mute);font-size:13px}
.fld input,.fld select,.fld textarea,.filters input,.filters select,.cell{border:1px solid var(--field);border-radius:5px;padding:8px 10px;background:#fff;width:100%;min-height:40px}
.fld input[readonly]{background:#EEF3F7}
.fld textarea{resize:vertical}
.btn{border:1px solid var(--sea);background:var(--sea);color:#fff;border-radius:999px;padding:9px 20px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--sea2)}
.btn.ghost{background:#fff;color:var(--sea)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:#FBEDEA}
.btn.aqua{background:var(--aqua);border-color:var(--aqua);color:#04263A}
.btn.aqua:hover{background:#4CBAD4}
.btn.sm{padding:4px 13px;font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tbl .acts{flex-wrap:nowrap}
.tbl td:last-child{white-space:nowrap}
.tbl .acts .btn{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#DEEAF3;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:2px solid var(--line);color:var(--deep)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--tint)}
.tbl img.th{width:38px;height:38px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}
.tbl .cell{min-height:36px;padding:5px 8px;min-width:90px}
.tbl .cell.a{min-width:110px;text-align:right}
.tbl .cell.h{min-width:180px}
.empty{color:var(--mute);text-align:center;padding:18px}
.cnt{color:var(--mute);font-size:13px;margin:0 0 8px}
.fb img{max-width:130px;max-height:110px;display:block;margin-bottom:6px;border:1px solid var(--line);border-radius:4px}
.fb input{font-size:13px;padding:4px!important;min-height:0!important}
.sigbox{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{margin-top:5px;width:18px;height:18px}
.pledge{background:var(--tint);border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-bottom:8px;white-space:pre-wrap;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{color:var(--mute);font-size:13px}
.kpi.hero{background:var(--sea);color:#fff;border-color:var(--sea);grid-column:span 2}
.kpi.hero span{color:#B9D6EA}
.kpi.hero b{font-size:34px}
.kpi.warn b{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars div.b{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;margin:8px 0}
.bars i{display:block;height:14px;background:var(--aqua);border-radius:3px;min-width:2px}
.seg{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.seg label{display:flex;gap:6px;align-items:center;cursor:pointer}
.note{color:var(--mute);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{background:#FDECEA;color:var(--red);border-radius:12px;padding:2px 10px;font-size:12.5px}
details{margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--deep)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:.25s;z-index:120;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#dlg{position:fixed;inset:0;background:rgba(6,42,68,.6);display:none;place-items:center;z-index:110;padding:16px}
#dlg.show{display:grid}
#dlg>div{background:#fff;border-radius:8px;padding:20px;max-width:380px;width:100%}
#dlg p{margin:0 0 16px;font-weight:600}
#dlg .row{margin:0;justify-content:flex-end}
#busy{position:fixed;inset:0;background:rgba(6,42,68,.5);display:none;place-items:center;z-index:100;color:#fff;font-weight:700}
#busy.show{display:grid}
#busy span{background:var(--deep);padding:12px 22px;border-radius:8px}
/* documents */
.doc{background:transparent;color:#000;font-size:13px;line-height:1.55;padding:6px;position:relative;z-index:0}
.lh{position:relative;border-bottom:2px solid #0A3D62;padding-bottom:8px;margin-bottom:10px;text-align:center;min-height:72px}
.lh img{position:absolute;left:0;top:0;height:66px;width:66px;object-fit:cover;border-radius:50%}
.lh .lt{padding:0 78px}
.lh h2{margin:0;font-size:22px;color:#0A3D62}
.lh p{margin:0;font-size:12px}
.dt{display:table;margin:8px auto;border:1.5px solid #0A3D62;border-radius:4px;padding:3px 26px;font-weight:700;font-size:16px;color:#0A3D62}
.dmeta{display:flex;justify-content:space-between;margin-bottom:8px}
.dtop{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.dtop>div:first-child{flex:1}
.dtop .kv{margin-bottom:0}
.dphoto{width:84px;height:100px;border:1px solid #444;display:grid;place-items:center;color:#777;font-size:12px;overflow:hidden;flex:none}
.dphoto img{width:100%;height:100%;object-fit:cover}
.kv{width:100%;border-collapse:collapse;margin-bottom:8px}
.kv td,.kv th{border:1px solid #6F8797;padding:4px 7px;vertical-align:top;text-align:left}
.kv th{background:rgba(228,238,245,.85);width:19%;font-weight:600}
.kv td.n,.kv th.n{text-align:right;width:auto}
.dh3{font-weight:700;margin:10px 0 4px;color:#0A3D62}
.sigrow{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.sgb{text-align:center;min-width:120px;flex:1}
.sigimg{height:44px;max-width:150px;display:block;margin:0 auto;object-fit:contain;mix-blend-mode:multiply}
.sgl{border-top:1px solid #000;margin:2px auto 0;padding-top:2px;font-size:12px;width:96px}
.pb{page-break-before:always;break-before:page}
.atts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.atts div{border:1px solid #6F8797;padding:6px;text-align:center;font-size:12px}
.atts img{max-width:100%;max-height:340px}
.rc{max-width:600px;margin:0 auto;border:1px solid #4E6A7C;padding:14px}
.rc .kv{font-size:11.5px}
.rc .kv th{width:auto}
.wmk{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:-1;pointer-events:none}
.wmk img{width:62%;max-width:120mm;opacity:.08;filter:grayscale(1)}
.pfoot{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:9.5px;color:#234;border-top:1px solid #0A3D62;padding-top:2px;background:#fff}
.credit{position:fixed;right:-8mm;top:50%;writing-mode:vertical-rl;font-size:7px;color:#666;white-space:nowrap}
/* ID cards (portrait) */
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pair{display:flex;gap:4mm;break-inside:avoid}
.idc{width:54mm;height:85.6mm;border:.3mm solid #0A3D62;border-radius:3mm;overflow:hidden;background:#fff;color:#000;display:flex;flex-direction:column;font-size:7.5pt;line-height:1.35;position:relative;z-index:0;break-inside:avoid}
.idc .wm{position:absolute;left:50%;top:50%;width:34mm;transform:translate(-50%,-50%);opacity:.09;z-index:-1;filter:grayscale(1)}
.idc .ih{background:#0A3D62;color:#fff;position:relative;height:14mm;display:flex;align-items:center;justify-content:center;padding:0 2mm 0 13mm;text-align:center}
.idc .ih img{position:absolute;left:2mm;top:50%;transform:translateY(-50%);height:9.5mm;width:9.5mm;border-radius:50%;background:#fff;object-fit:cover}
.idc .ih b{font-size:8.6pt;line-height:1.2}
.idc .ib{display:flex;flex-direction:column;align-items:center;padding:2.5mm 3mm 0;flex:1;gap:.8mm}
.idc .ph{width:23mm;height:28mm;border:.35mm solid #0A3D62;overflow:hidden;display:grid;place-items:center;font-size:7pt;color:#888}
.idc .ph img{width:100%;height:100%;object-fit:cover}
.idc .nm{font-weight:700;font-size:10pt;color:#0A3D62;text-align:center;line-height:1.2;margin-top:1mm}
.idc .rows{align-self:stretch;text-align:center;font-size:7.5pt}
.idc .sb{text-align:center;padding:0 3mm 1mm}
.idc .sb img{height:7mm;display:block;margin:0 auto;mix-blend-mode:multiply}
.idc .sb span{display:block;border-top:.25mm solid #000;width:18mm;margin:0 auto;font-size:6.5pt}
.idc .if{background:#1FA3C4;color:#03283B;text-align:center;font-size:7pt;font-weight:600;padding:1.2mm 2mm;min-height:6.5mm}
.idc .bd{padding:3mm;flex:1;font-size:7.3pt}
.idc .bd div{margin-bottom:1.2mm}
.idc .cr{font-size:5.5pt;font-weight:400}
#foot{background:var(--deep);color:#CFE3F1;text-align:center;font-size:13px;padding:16px 14px 12px;margin-top:8px;line-height:1.7}
#foot:empty{display:none}
#foot b{color:#fff;font-size:15px}
#foot a{color:#8FD6E8}
#foot .cr{font-size:11px;opacity:.7;margin-top:4px}
.erow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.erow .c{flex:2;min-width:0}.erow .m{flex:1;min-width:0}
@media(max-width:720px){.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.kpi.hero{grid-column:span 1}main{padding:12px}}
@media screen{.cards{zoom:.9}}
#printArea{display:none}
#stage{display:block;position:fixed;left:-10000px;top:0;width:640px;background:#fff}
#stage .wmk{position:absolute}
#stage .pfoot{position:static;margin-top:10px}
@media print{
 body{background:#fff}
 #app,#toast,#dlg,#busy{display:none!important}
 #printArea{display:block;position:relative;z-index:0;padding-bottom:12mm}
 #stage{display:none}
 @page{size:A4;margin:10mm 12mm}
 .cards{zoom:1;gap:4mm}
 .pair{margin:0 auto 4mm}
 .idc,.kv th,.lh,.dphoto,.idc .ih,.idc .if,.wmk img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="মেনু" aria-expanded="false" onclick="toggleMenu()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand" id="brand">হিফয মাদরাসা</div>
    <div id="stat"></div>
  </header>
  <div class="scrim" id="scrim" onclick="toggleMenu()"></div>
  <nav class="drawer" id="drawer"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div id="printArea"></div>
<div id="stage"></div>
<div id="toast" role="status"></div>
<div id="busy"><span>অপেক্ষা করুন…</span></div>
<div id="dlg"><div><p></p><div class="row"><button class="btn ghost" id="dlgN">না</button><button class="btn danger" id="dlgY">হ্যাঁ</button></div></div></div>

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const BND='০১২৩৪৫৬৭৮৯';
const bn=v=>String(v==null?'':v).replace(/\d/g,d=>BND[d]);
const en=s=>String(s||'').replace(/[০-৯]/g,d=>BND.indexOf(d));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const DEPTS=['কায়দা','নাজেরা','হিফয','শুনানি'];
const TYPES=['আবাসিক','অনাবাসিক'];
const BLOOD=['','A+','A-','B+','B-','AB+','AB-','O+','O-'];
const DESIG=['মুহতামিম','নাযিমে তালীমাত','প্রধান শিক্ষক','শিক্ষক','হাফেজ উস্তায','সহকারী শিক্ষক','হিসাবরক্ষক','বাবুর্চি','খাদেম','নিরাপত্তা কর্মী'];
const CATS=['বাজার / খাবার','বিদ্যুৎ বিল','গ্যাস / পানি','বাড়ি ভাড়া','কিতাব ও শিক্ষা উপকরণ','মেরামত','পরিবহন','অন্যান্য'];
const PLEDGE='আমি/আমরা অঙ্গীকার করছি যে প্রতিষ্ঠানের সকল নিয়ম-কানুন মেনে চলব, নির্ধারিত ফি সময়মতো পরিশোধ করব এবং শিক্ষার্থীর আদব-আখলাক ও পড়াশোনার বিষয়ে প্রতিষ্ঠানের সঙ্গে সহযোগিতা করব।';
const APPROVAL='উপরোক্ত তথ্য যাচাই করে শিক্ষার্থীকে প্রতিষ্ঠানের নিয়মানুযায়ী ভর্তির জন্য অনুমোদন করা হলো।';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=(n,l)=>String(n).padStart(l,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
const ym=()=>today().slice(0,7);
const fdate=d=>d?bn(d.split('-').reverse().join('/')):'';
const fmonth=m=>m?MONTHS[+m.slice(5,7)-1]+' '+bn(m.slice(0,4)):'';
const tk=n=>bn((Math.round((+n||0)*100)/100).toLocaleString('en-US'))+' ৳';
const num=id=>+en($('#'+id).value)||0;
const v=id=>{const e=$('#'+id);return e?e.value.trim():''};
const ck=id=>$('#'+id).checked;
function age(dob){if(!dob)return '';const b=new Date(dob),n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}return y<0?'':bn(y)+' বছর '+bn(m)+' মাস'}
function monthsBetween(a,b){const o=[];let[y,m]=a.split('-').map(Number);const[ey,em]=b.split('-').map(Number);while(y<ey||(y===ey&&m<=em)){o.push(y+'-'+pad(m,2));m++;if(m>12){m=1;y++}}return o}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function ask(msg){return new Promise(res=>{$('#dlg p').textContent=msg;$('#dlg').classList.add('show');const done=x=>{$('#dlg').classList.remove('show');$('#dlgY').onclick=$('#dlgN').onclick=null;res(x)};$('#dlgY').onclick=()=>done(true);$('#dlgN').onclick=()=>done(false)})}
const busy=on=>$('#busy').classList.toggle('show',!!on);
const setStat=t=>{const e=$('#stat');if(e)e.textContent=t};

/* ================= data + Google Sheet API ================= */
const defDB=()=>({settings:{name:'',logo:'',founded:'',director:'',directorMobile:'',directorSig:'',headTeacher:'',address:'',facebook:'',youtube:'',whatsapp:'',pledge:PLEDGE,approval:APPROVAL},students:[],collections:[],feeRules:[],staff:[],salaries:[],expenses:[],seq:{form:0,receipt:0,staff:0,voucher:0,salary:0}});
let DB=defDB(),LOADED=false,PW='';
try{PW=localStorage.getItem('madrasa_pw')||''}catch(e){}
const NUMF=new Set(['formNo','salary','amount','totalDue','totalPaid','remaining','receiptNo','no','base','extra','ded','net','paid','created']);
const BOOLF=new Set(['pledge','approved']);
const JSONF=new Set(['lines','history','seq','items']);
function norm(rec){for(const k in rec){const x=rec[k];
  if(JSONF.has(k)){try{rec[k]=x?(typeof x==='string'?JSON.parse(x):x):(k==='seq'?{}:[])}catch(e){rec[k]=k==='seq'?{}:[]}}
  else if(NUMF.has(k))rec[k]=+x||0;
  else if(BOOLF.has(k))rec[k]=(x===true||x==='true'||x==='TRUE')}
  return rec}

/* ================= fee logic ================= */
function feeAmount(r,month){let a=0;r.history.slice().sort((x,y)=>x.from<y.from?-1:1).forEach(h=>{if(h.from<=month)a=h.amount});return a}
const rulesFor=s=>DB.feeRules.filter(r=>(r.dept==='সকল'||r.dept===s.dept)&&(r.type==='সকল'||r.type===s.type));
function studentDues(s,month,excludeId){
  const start=s.admDate.slice(0,7),res={},ms=start<=month?monthsBetween(start,month):[];
  rulesFor(s).forEach(r=>{res[r.head]=res[r.head]||{acc:0,paid:0};if(!ms.length)return;
    if(r.freq==='once')res[r.head].acc+=feeAmount(r,start);
    else if(r.freq==='event')r.history.forEach(h=>{if(h.from>=start&&h.from<=month)res[r.head].acc+=h.amount});
    else ms.forEach(m=>{res[r.head].acc+=feeAmount(r,m)})});
  DB.collections.forEach(c=>{if(c.studentId===s.id&&c.id!==excludeId&&c.month<=month)c.lines.forEach(l=>{res[l.head]=res[l.head]||{acc:0,paid:0};res[l.head].paid+=l.paid})});
  return res;
}
function monthlyBreakdown(s,month,d){
  const start=s.admDate.slice(0,7),ms=monthsBetween(start,month),out={},heads={};
  rulesFor(s).forEach(r=>{if(r.freq==='monthly')(heads[r.head]=heads[r.head]||[]).push(r)});
  Object.entries(heads).forEach(([h,rs])=>{let paid=(d[h]&&d[h].paid)||0;const list=[];ms.forEach(m=>{const amt=rs.reduce((t,r)=>t+feeAmount(r,m),0);if(amt<=0)return;const take=Math.min(paid,amt);paid-=take;const rem=amt-take;if(rem>0.001)list.push({m,rem})});out[h]=list});
  return out;
}
function outstanding(asOf){const rows=[];let total=0;DB.students.forEach(s=>{if(s.admDate.slice(0,7)>asOf)return;let due=0;Object.values(studentDues(s,asOf)).forEach(x=>{due+=x.acc-x.paid});if(due>0.001){rows.push({s,due});total+=due}});rows.sort((a,b)=>b.due-a.due);return{rows,total}}
function repData(from,to){
  const inR=d=>{const m=(d||'').slice(0,7);return m>=from&&m<=to};
  const cols=DB.collections.filter(c=>inR(c.date)),ex=DB.expenses.filter(e=>inR(e.date)),sl=DB.salaries.filter(x=>inR(x.date));
  const S=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
  const byHead={},byCat={};
  cols.forEach(c=>c.lines.forEach(l=>{if(l.paid)byHead[l.head]=(byHead[l.head]||0)+l.paid}));
  ex.forEach(e=>{(e.items&&e.items.length?e.items:[{cat:e.cat,amount:e.amount}]).forEach(i=>{const k=i.cat||'অন্যান্য';byCat[k]=(byCat[k]||0)+i.amount})});
  return{byHead,byCat,inc:S(cols,c=>c.totalPaid),exp:S(ex,e=>e.amount),sal:S(sl,x=>x.paid),adm:DB.students.filter(s=>inR(s.admDate)).length};
}

async function saveFee(){
  const sid=v('c_st'),m=v('c_m');
  if(!sid)return toast('শিক্ষার্থী নির্বাচন করুন');if(!m||!v('c_date'))return toast('তারিখ ও মাস দিন');
  const lines=[];document.querySelectorAll('#lines tbody tr').forEach(tr=>lines.push({head:tr.dataset.head,total:+tr.dataset.total,prev:+tr.dataset.prev,due:+tr.dataset.due,paid:+en(tr.querySelector('.pd').value)||0}));
  const tp=lines.reduce((t,l)=>t+l.paid,0),td=lines.reduce((t,l)=>t+l.due,0);
  if(!lines.length||tp<=0)return toast('অন্তত একটি খাতে পরিশোধের পরিমাণ দিন');
  const ex=DB.collections.find(x=>x.id===R.id),rn=ex?ex.receiptNo:DB.seq.receipt+1;
  const o={id:ex?ex.id:uid(),receiptNo:rn,date:v('c_date'),month:m,studentId:sid,lines,totalDue:td,totalPaid:tp,remaining:td-tp,note:v('c_note'),sigCash:getSig('c_sc')};
  const ops=[{op:'upsert',table:'collections',rec:wireK(o,ex,['sigCash'])}];if(!ex)ops.push(seqOp({receipt:rn}));
  if(!await work(()=>batch(ops)))return;
  o._full=true;if(ex)DB.collections[DB.collections.indexOf(ex)]=o;else{DB.collections.push(o);DB.seq.receipt=rn}
  toast('রশিদ সংরক্ষিত');go('fee');
}
async function delFee(id){if(!await ask('এই রশিদটি মুছে ফেলবেন?'))return;if(!await work(()=>batch([{op:'delete',table:'collections',id}])))return;DB.collections=DB.collections.filter(c=>c.id!==id);render();toast('মুছে ফেলা হয়েছে')}

async function printRc(id){try{const c=await hydrate('collections',DB.collections.find(x=>x.id===id));printHTML(receiptDoc(c))}catch(e){handleErr(e)}}
async function shareRc(id){
  let c;try{c=await hydrate('collections',DB.collections.find(x=>x.id===id))}catch(e){return handleErr(e)}
  const st=$('#stage');st.innerHTML=receiptDoc(c);st.firstElementChild.insertAdjacentHTML('afterbegin',wmHTML());st.firstElementChild.insertAdjacentHTML('beforeend',`<div class="pfoot">${footLine()}</div>`);
  if(!window.html2canvas){st.innerHTML='';return toast('ইমেজ তৈরির জন্য ইন্টারনেট প্রয়োজন')}
  try{const cv=await html2canvas(st.firstElementChild,{scale:2,backgroundColor:'#fff'});
    cv.toBlob(async b=>{const f=new File([b],'receipt-'+c.receiptNo+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'ফি রশিদ'})}catch(e){}}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();toast('ইমেজ ডাউনলোড হয়েছে')}
      st.innerHTML=''},'image/png')}catch(e){st.innerHTML='';toast('ইমেজ তৈরি করা যায়নি')}
}

async function saveStf(){
  if(!v('t_name'))return toast('নাম লিখুন');if(!v('t_desig'))return toast('পদবি লিখুন');
  const ex=DB.staff.find(x=>x.id===R.id),n=ex?0:DB.seq.staff+1;
  const o={id:ex?ex.id:uid(),tid:ex?ex.tid:'স-'+pad(n,3),joinDate:v('t_date'),name:v('t_name'),father:v('t_father'),dob:v('t_dob'),desig:v('t_desig'),edu:v('t_edu'),nid:en(v('t_nid')),mobile:en(v('t_mobile')),salary:num('t_salary'),perm:v('t_perm'),pres:v('t_pres'),photo:FV.t_photo,sig:getSig('t_sig')};
  const ops=[{op:'upsert',table:'staff',rec:wireK(o,ex,['sig'])}];if(!ex)ops.push(seqOp({staff:n}));
  if(!await work(()=>batch(ops)))return;
  o._full=true;if(ex)DB.staff[DB.staff.indexOf(ex)]=o;else{DB.staff.push(o);DB.seq.staff=n}
  toast('সংরক্ষিত');go('stf');
}
async function delStf(id){const t=DB.staff.find(x=>x.id===id);if(!await ask(`“${t.name}” এবং তার বেতনের রেকর্ড মুছে যাবে। নিশ্চিত?`))return;
  const ops=[{op:'delete',table:'staff',id},...DB.salaries.filter(x=>x.staffId===id).map(x=>({op:'delete',table:'salaries',id:x.id}))];
  if(!await work(()=>batch(ops)))return;
  DB.staff=DB.staff.filter(x=>x.id!==id);DB.salaries=DB.salaries.filter(x=>x.staffId!==id);render();toast('মুছে ফেলা হয়েছে')}

async function saveRules(){
  rtRead();
  const rows=RT.filter(r=>r.id||(r.amount!==''&&r.amount!=null));
  for(const r of rows){
    if(!r.head)return toast('খাতের নাম লিখুন');
    if(r.amount===''||isNaN(+en(r.amount)))return toast(`“${r.head}” এর পরিমাণ দিন`);
    if(!r.from)return toast(`“${r.head}” এর কার্যকর মাস দিন`);
  }
  const seen=new Set();for(const r of rows){const k=[r.head,r.dept,r.type].join('|');if(seen.has(k))return toast(`“${r.head}” (${r.dept}/${r.type}) দুইবার আছে`);seen.add(k)}
  const keepIds=new Set(rows.filter(r=>r.id).map(r=>r.id)),removed=DB.feeRules.filter(r=>!keepIds.has(r.id));
  if(removed.length&&!await ask(`${bn(removed.length)} টি ফি মুছে যাবে। নিশ্চিত?`))return;
  const ops=[],next=[];
  rows.forEach(r=>{
    const amt=+en(r.amount),orig=DB.feeRules.find(x=>x.id===r.id);let rule;
    if(!orig)rule={id:uid(),head:r.head,dept:r.dept,type:r.type,freq:r.freq,history:[{from:r.from,amount:amt}]};
    else{rule=JSON.parse(JSON.stringify(orig));Object.assign(rule,{head:r.head,dept:r.dept,type:r.type,freq:r.freq});
      if(amt!==r.oa||r.from!==r.of){rule.history=rule.history.filter(h=>h.from!==r.from);rule.history.push({from:r.from,amount:amt})}}
    next.push(rule);if(!orig||JSON.stringify(rule)!==JSON.stringify(orig))ops.push({op:'upsert',table:'feeRules',rec:rule});
  });
  removed.forEach(r=>ops.push({op:'delete',table:'feeRules',id:r.id}));
  if(ops.length&&!await work(()=>batch(ops)))return;
  DB.feeRules=next;RT=null;render();toast('ফি সংরক্ষিত হয়েছে');
}

  <div class="dh3">খাত ভিত্তিক ব্যয়</div><table class="kv">${Object.entries(D.byCat).map(([h,a])=>`<tr><td>${esc(h)}</td><td class="n">${tk(a)}</td></tr>`).join('')}<tr><td>শিক্ষক ও কর্মচারীর বেতন</td><td class="n">${tk(D.sal)}</td></tr></table>
  ${monthly?`<div class="dh3">মাস ভিত্তিক সারসংক্ষেপ</div><table class="kv"><tr><th>মাস</th><th class="n">আয়</th><th class="n">ব্যয়</th><th class="n">উদ্বৃত্ত</th></tr>${monthly}</table>`:''}
  <div class="dh3">বকেয়া তালিকা (${fmonth(asOf)} পর্যন্ত) — মোট ${tk(out.total)}</div><table class="kv"><tr><th>আইডি</th><th>নাম</th><th>বিভাগ</th><th class="n">বকেয়া</th></tr>${out.rows.map(r=>`<tr><td>${bn(r.s.sid)}</td><td>${esc(r.s.name)}</td><td>${r.s.dept}</td><td class="n">${tk(r.due)}</td></tr>`).join('')||'<tr><td colspan="4">কোনো বকেয়া নেই</td></tr>'}</table>`;
  window.__rep=`<div class="doc">${lh()}<div class="dt">${label}</div>${body}<div class="sigrow">${sg('','ক্যাশিয়ার')}${sg(DB.settings.directorSig,'পরিচালক')}</div></div>`;
  const inp='padding:8px;border:1px solid var(--field);border-radius:5px';
  const picker=kind==='m'?`<input type="month" value="${RP.m}" onchange="RP.m=this.value||ym();render()" style="${inp}">`:kind==='y'?`<input type="number" value="${RP.y}" min="2000" max="2100" onchange="RP.y=+en(this.value)||new Date().getFullYear();render()" style="width:100px;${inp}">`:'';
  return `<div class="bar"><h1>${label}</h1><div class="acts">${picker}<button class="btn" onclick="printHTML(window.__rep)">প্রিন্ট</button></div></div><div class="panel">${window.__rep}</div>`;
}

/* ================= setup ================= */
function pSetup(){
  const s=DB.settings;
  return `<div class="bar"><h1>প্রতিষ্ঠান সেটাপ</h1></div>
  <div class="panel"><div class="grid">
   ${fld('p_name','প্রতিষ্ঠানের নাম',s.name)}${fld('p_found','প্রতিষ্ঠাকাল (সাল)',s.founded)}
   ${fld('p_dir','পরিচালকের নাম',s.director)}${fld('p_dmob','পরিচালকের মোবাইল',s.directorMobile,'tel')}${fld('p_head','প্রধান শিক্ষকের নাম',s.headTeacher)}
   ${area('p_addr','ঠিকানা',s.address,'full')}
   ${fld('p_fb','Facebook',s.facebook,'text','placeholder="পেজের লিংক"')}${fld('p_yt','YouTube',s.youtube,'text','placeholder="চ্যানেলের লিংক"')}${fld('p_wa','WhatsApp',s.whatsapp,'tel')}
  </div><div class="sec" style="margin-top:18px">লোগো ও স্বাক্ষর</div><div class="grid">${fileBox('p_logo','লোগো',s.logo,200,38000)}${sigBox('p_sig','পরিচালকের স্বাক্ষর',s.directorSig)}</div>
  <div class="sec">ভর্তি ফরমের লেখা</div><div class="grid">
   ${area('p_pl','অঙ্গীকারনামা',s.pledge,'full',5)}
   ${area('p_ap','অনুমোদন',s.approval,'full',3)}
  </div>
  <div class="row"><button class="btn" onclick="saveSetup()">সংরক্ষণ করুন</button></div></div>`;
}
async function saveSetup(){
  const ex=DB.settings;
  const rec={id:'main',name:v('p_name'),founded:en(v('p_found')),director:v('p_dir'),directorMobile:en(v('p_dmob')),headTeacher:v('p_head'),address:v('p_addr'),facebook:v('p_fb'),youtube:v('p_yt'),whatsapp:en(v('p_wa')),logo:FV.p_logo||'',directorSig:keep(ex,'directorSig',getSig('p_sig')),pledge:v('p_pl')||PLEDGE,approval:v('p_ap')||APPROVAL};
  if(!await work(()=>batch([{op:'upsert',table:'settings',rec}])))return;
  Object.assign(DB.settings,rec,{directorSig:getSig('p_sig')});delete DB.settings.id;
  render();toast('সেটাপ সংরক্ষিত');
}

boot();
</script>
